# No push em main: builda o servidor, clona o cliente, gera data/ e faz push no cliente.
# Secret CLIENT_REPO_TOKEN (PAT com permissão no ocbmon-showdown-client) em Settings > Secrets.
name: Build server and sync client data

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push-client:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout server
        uses: actions/checkout@v4
        with:
          path: pokemon-showdown

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build server
        run: |
          cd pokemon-showdown
          npm ci
          node build

      # Repo público: clone via HTTPS sem token. Push no passo seguinte exige CLIENT_REPO_TOKEN.
      - name: Clone client repo
        working-directory: ${{ github.workspace }}
        run: git clone --depth 1 https://github.com/feneto7/ocbmon-showdown-client.git pokemon-showdown-client

      - name: Build client (full) with server data
        run: |
          cd pokemon-showdown-client
          npm ci
          node build full

      - name: Commit and push client data
        env:
          CLIENT_REPO_TOKEN: ${{ secrets.CLIENT_REPO_TOKEN }}
        run: |
          if [ -z "$CLIENT_REPO_TOKEN" ]; then
            echo "::error::Crie o secret CLIENT_REPO_TOKEN (PAT classic com scope repo) em Settings > Secrets > Actions neste repositório."
            exit 1
          fi
          cd pokemon-showdown-client
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add play.pokemonshowdown.com/data/
          git status
          if git diff --staged --quiet; then
            echo "No changes in client data."
          else
            git commit -m "chore: update client data from server [skip ci]"
            git push "https://x-access-token:${CLIENT_REPO_TOKEN}@github.com/feneto7/ocbmon-showdown-client.git" HEAD:main
          fi
