# No push em main: builda o servidor, clona o cliente, gera data/ e faz push no cliente.
# Secret CLIENT_REPO_TOKEN (PAT com permissão no ocbmon-showdown-client) em Settings > Secrets.
name: Build server and sync client data

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push-client:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout server
        uses: actions/checkout@v4
        with:
          path: pokemon-showdown

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build server
        run: |
          cd pokemon-showdown
          npm ci
          node build

      - name: Clone client repo
        uses: actions/checkout@v4
        with:
          repository: feneto7/ocbmon-showdown-client
          token: ${{ secrets.CLIENT_REPO_TOKEN }}
          path: pokemon-showdown-client

      - name: Build client (full) with server data
        run: |
          cd pokemon-showdown-client
          npm ci
          node build full

      - name: Commit and push client data
        run: |
          cd pokemon-showdown-client
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add play.pokemonshowdown.com/data/
          git status
          if git diff --staged --quiet; then
            echo "No changes in client data."
          else
            git commit -m "chore: update client data from server [skip ci]"
            git push
          fi
