# Ping HTTP no Render a cada 10 min (UTC). Só agenda na BRANCH PADRÃO do repo (Settings > Branches).
# Se não aparecer nenhum run: confira se este ficheiro existe na branch padrão (main ou master).
name: Keep server awake

on:
  schedule:
    - cron: '5,15,25,35,45,55 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: curl -fsS -o /dev/null -w '%{http_code}\n' --max-time 60 https://ocbmon-showdown.onrender.com/
